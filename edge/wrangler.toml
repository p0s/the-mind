name = "the-mind-edge"
main = "worker.js"
compatibility_date = "2026-09-22"

# The repository's existing build writes the public site to ../dist. The
# deployment owner attaches this Worker to the canonical hostname and supplies
# only the server-side analytics variables; this file contains no credentials.
[assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = true
